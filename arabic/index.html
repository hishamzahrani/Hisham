<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ضاد</title>
  <meta name="description" content="تطبيق لتعلّم علوم العربية: النحو والصرف والبلاغة وعلم المعاني وعلم البيان وفقه اللغة ومعاني المفردات، لمن هم في الخامسة عشرة فما فوق.">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" data-act="home" aria-label="الرئيسية"><span class="brand-dad">ض</span><span>ضاد</span></button>
      <div class="stats">
        <span class="stat" title="أيام متتالية">🔥 <b id="s-streak">٠</b></span>
        <span class="stat" title="نقاط الخبرة">⭐ <b id="s-xp">٠</b></span>
        <button class="icon-btn" data-act="theme" aria-label="تبديل المظهر">◐</button>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabs" id="tabs">
      <button data-act="home" data-tab="home" class="active"><span>📚</span>العلوم</button>
      <button data-act="review" data-tab="review"><span>🔁</span>المراجعة</button>
      <button data-act="stats" data-tab="stats"><span>📊</span>تقدّمي</button>
    </nav>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
